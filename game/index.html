<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NUSA HEAT — Teluk Nusa</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1026; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #eef1f5; text-shadow: 0 1px 3px rgba(0,0,0,.8); z-index: 5; }
  #hud-top-left { position: absolute; top: 14px; left: 16px; max-width: 360px; }
  #hud-mission { background: rgba(0,0,0,.55); border-left: 3px solid #ffd23c; border-radius: 6px; padding: 8px 12px; }
  #hud-mission-title { font-size: 15px; font-weight: 800; color: #ffd23c; letter-spacing: 1px; }
  #hud-mission-objective { font-size: 13px; margin-top: 2px; }
  #hud-mission-giver { font-size: 11px; color: rgba(255,255,255,.6); margin-top: 3px; letter-spacing: 1px; }
  #hud-money { font-size: 40px; font-weight: 800; color: #7ee2a0; }
  #hud-health { width: 180px; height: 12px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.4); border-radius: 6px; margin-top: 8px; overflow: hidden; }
  #hud-health-fill { height: 100%; width: 100%; background: #3fae7a; }
  #hud-hint { margin-top: 8px; font-size: 10px; color: rgba(255,255,255,.65); }
  #hud-top-right { position: absolute; top: 14px; right: 16px; text-align: right; }
  #hud-stars { font-size: 24px; letter-spacing: 4px; color: rgba(255,255,255,.45); margin-top: 2px; }
  #hud-wanted-label { font-size: 12px; font-weight: 700; color: #ff5a4e; letter-spacing: 2px; }
  #hud-clock { font-size: 22px; font-weight: 700; margin-top: 4px; }
  #hud-radio { font-size: 12px; color: #ffd23c; letter-spacing: 1px; }
  #hud-dialogue { position: absolute; bottom: 252px; left: 16px; display: flex; gap: 10px; align-items: center; background: rgba(0,0,0,.68); border: 1px solid rgba(255,210,60,.5); border-radius: 8px; padding: 10px 12px; max-width: 430px; opacity: 0; transition: opacity .3s; }
  #hud-dialogue-portrait { flex: none; border-radius: 50%; }
  #hud-dialogue-name { font-size: 12px; font-weight: 800; color: #ffd23c; letter-spacing: 1px; }
  #hud-dialogue-text { font-size: 14px; margin-top: 2px; line-height: 1.35; }
  #hud-objective { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.6); border: 1px solid rgba(255,210,60,.6); border-radius: 8px; padding: 8px 16px; font-size: 15px; max-width: 60vw; text-align: center; }
  #hud-objective-dist { color: #ffd23c; font-weight: 700; }
  #hud-speed { position: absolute; bottom: 24px; right: 20px; font-size: 46px; font-weight: 800; display: none; }
  #hud-speed-unit { font-size: 14px; margin-left: 4px; color: rgba(255,255,255,.7); }
  #hud-nos { width: 150px; height: 10px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.4); border-radius: 5px; margin-top: 6px; overflow: hidden; position: relative; }
  #hud-nos-fill { height: 100%; width: 100%; background: #7ee2e2; }
  #hud-nos-label { position: absolute; right: 0; bottom: 18px; font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #7ee2e2; }
  #hud-toast { position: absolute; top: 132px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.72); border-radius: 8px; padding: 10px 18px; font-size: 15px; max-width: 70vw; text-align: center; transition: opacity .3s; }
  #hud-crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 22px; color: rgba(255,255,255,.85); display: none; }
  #hud-minimap { position: absolute; bottom: 16px; left: 16px; width: 220px; height: 220px; border: 2px solid rgba(255,255,255,.35); border-radius: 50%; background: #14333d; }
  #hud-damage { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(200,0,0,.55) 100%); transition: opacity .2s; }
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: linear-gradient(180deg, rgba(8,12,30,.82), rgba(20,10,30,.88)); color: #eef1f5; z-index: 10; padding: 20px; }
  .screen h1 { font-size: 84px; margin: 0; letter-spacing: 6px; color: #ffd23c; text-shadow: 0 4px 0 #c75b4a, 0 8px 24px rgba(0,0,0,.6); }
  .screen h2 { font-size: 56px; margin: 0 0 10px; letter-spacing: 4px; color: #ffd23c; }
  .screen .tagline { font-size: 18px; color: #9fc4d8; margin: 8px 0 18px; }
  .screen .story { font-size: 16px; line-height: 1.55; max-width: 620px; margin: 0 0 18px; color: #dfe6ee; }
  .screen .controls { font-size: 13px; line-height: 1.7; color: rgba(255,255,255,.65); margin-bottom: 22px; }
  .screen .buttons { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .screen button { pointer-events: auto; cursor: pointer; font-size: 17px; font-weight: 700; letter-spacing: 1px; padding: 13px 26px; border: none; border-radius: 8px; background: #ffd23c; color: #221a08; }
  .screen button:hover { background: #ffe27a; }
  .screen .save-note { margin-top: 16px; font-size: 13px; color: rgba(255,255,255,.55); }
</style>
</head>
<body>
<canvas id="game" aria-label="NUSA HEAT: an open-world crime game in Teluk Nusa"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
